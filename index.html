<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WabAR - PMB UNUGHA</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>📱</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <div id="lapisan-muat" class="hidden">
    <div class="wadah-muat">
      <div class="loading-spinner"></div>
      <p>Memuat AR...</p>
    </div>
  </div>

  <div id="lapisan-info">
    <div id="kepala" class="glass-panel">
      <h1>WabAR Experience</h1>
    </div>
    <div id="status-ar" class="glass-panel">
      <span class="spinner"></span>Siap untuk AR
    </div>
  </div>

  <div id="wadah-tombol">
    <button id="tombol-mulai" class="btn btn-glowing">
      Mulai AR
    </button>
    <button id="tombol-henti" class="btn-glowing-danger hidden">
      Hentikan
    </button>
  </div>

  <div id="wadah-kontrol" class="glass-panel">
    <button id="tombol-layar-penuh" class="btn-sidebar" title="Layar Penuh">
      <span class="icon">⛶</span>
    </button>
    <button id="tombol-suara" class="btn-sidebar" title="Suara">
      <span class="icon">🔊</span>
    </button>
    <button id="tombol-screenshot" class="btn-sidebar" title="Tangkapan Layar">
      <span class="icon">📸</span>
    </button>
    <button id="tombol-pengaturan" class="btn-sidebar" title="Pengaturan">
      <span class="icon">⚙️</span>
    </button>
  </div>

  <div id="scanner-guide" class="hidden">
    <div class="scanner-frame">
      <div class="scanner-text glass-panel">
        Arahkan kamera ke marker
      </div>
    </div>
  </div>

  <div id="scan-problem-btn" class="glass-panel hidden">
    Coba Ulang Deteksi
  </div>

  <div id="kontrol-model" class="glass hidden">
    <div class="tombol-kontrol">
      <button id="putar-kiri" class="control-btn">←</button>
      <button id="putar-kanan" class="control-btn">→</button>
      <button id="perbesar" class="control-btn">+</button>
      <button id="perkecil" class="control-btn">-</button>
      <button id="tombol-putar-otomatis" class="control-btn">↺</button>
      <button id="tombol-atur-ulang" class="control-btn">R</button>
    </div>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" color-space="sRGB"
    renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <img id="gambar-brosur-depan" src="./pamflet-depan.jpg">
      <img id="gambar-brosur-belakang" src="./pamflet-belakang.jpg">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"
      raycaster="far: 10000; objects: .bisa-diklik"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-light type="directional" position="0 1 1" intensity="1.2" color="#fff"></a-light>
      <a-light type="ambient" intensity="0.8" color="#fff"></a-light>

      <a-entity id="brosur-wrapper" class="bisa-diklik" position="0 0 0.1" scale="2 2 2" visible="false"
        data-base-scale="2 2 2">
        <a-entity id="brosur" interaksi-brosur>
          <a-image src="#gambar-brosur-depan" position="0 0 0.005" width="1" height="1.4" material="side: front">
          </a-image>
          <a-image src="#gambar-brosur-belakang" position="0 0 -0.005" rotation="0 180 0" width="1" height="1.4"
            material="side: front">
          </a-image>
          <a-box width="1.2" height="1.6" depth="0.05" material="opacity: 0; transparent: true">
          </a-box>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="modal-pengaturan" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>Pengaturan</h2>
      <div class="settings-group">
        <label>
          Rotasi Otomatis
          <input type="checkbox" id="toggle-rotasi-otomatis" checked>
        </label>
        <label>
          Kecepatan Animasi: <span id="nilai-kecepatan">5</span>
          <input type="range" id="kecepatan-animasi" min="1" max="10" value="5">
        </label>
        <label>
          Kontrol Gerakan
          <input type="checkbox" id="gesture-control-toggle" checked>
        </label>
      </div>
    </div>
  </div>

  <div id="indikator-marker" class="hidden">
    <div class="pulse-dot"></div>
    <p>Marker Terdeteksi</p>
  </div>

  <script src="script.js"></script>
</body>

</html>
